<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Vai Junto - Mapeamento de Rota</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        #map { height: 75vh; width: 100vw; }
        .controls { padding: 15px; background: #f8f9fa; text-align: center; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 0 5px; }
        #status-rota { margin-top: 10px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

<div class="controls">
    <p>Clique nas paradas na ordem da sua viagem para criar a <b>Rota</b> da Carona.</p>
    <button id="saveBtn" disabled>Oferecer Carona</button>
    <button id="clearBtn">Limpar Rota</button>
    <div id="status-rota">Trajeto: Nenhum nó selecionado</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Inicializa o mapa
    const map = L.map('map').setView([-12.23, -38.96], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    // Pontos/Nós (Simulando locais como Campus, Terminal, Shopping, etc)
    const nodes = [
        { id: 1, nome: "Campus (Pórtico)", lat: -12.1978, lng: -38.9733 },
        { id: 2, nome: "Terminal Central", lat: -12.2662, lng: -38.9665 },
        { id: 3, nome: "Shopping", lat: -12.2570, lng: -38.9480 },
        { id: 4, nome: "Rodoviária", lat: -12.2750, lng: -38.9550 }
    ];

    let selectedNodes = [];
    let polyline = null;
    let markers = [];

    // Adiciona os marcadores no mapa
    nodes.forEach(node => {
        let marker = L.marker([node.lat, node.lng]).addTo(map);
        marker.bindTooltip(node.nome, { permanent: true, direction: 'top' });

        marker.on('click', () => {
            // Evita clicar no mesmo nó sequencialmente
            if (selectedNodes.length > 0 && selectedNodes[selectedNodes.length - 1].id === node.id) return;

            selectedNodes.push(node);
            updateMapVisuals();
        });
        markers.push(marker);
    });

    function updateMapVisuals() {
        if (polyline) map.removeLayer(polyline);

        if (selectedNodes.length > 1) {
            const latlngs = selectedNodes.map(n => [n.lat, n.lng]);
            polyline = L.polyline(latlngs, { color: 'blue', weight: 4 }).addTo(map);
            document.getElementById('saveBtn').disabled = false;
        }

        const rotaNomes = selectedNodes.map(n => n.nome).join(" ➔ ");
        document.getElementById('status-rota').innerText = "Trajeto: " + rotaNomes;
    }

    document.getElementById('clearBtn').onclick = () => {
        selectedNodes = [];
        if (polyline) map.removeLayer(polyline);
        document.getElementById('saveBtn').disabled = true;
        document.getElementById('status-rota').innerText = "Trajeto: Nenhum nó selecionado";
    };

    // Salva a carona gerando os Trechos
    document.getElementById('saveBtn').onclick = async () => {
        const trechos = [];

        // Converte a lista de nós selecionados em Trechos (inicio, fim)
        for (let i = 0; i < selectedNodes.length - 1; i++) {
            trechos.push({
                inicio: selectedNodes[i].id,
                fim: selectedNodes[i+1].id
            });
        }

        // Payload baseado no construtor da entidade Carona
        const caronaData = {
            idMotorista: "motorista_12345",
            vagas: 4,
            data: new Date().toISOString(), // LocalDateTime espera formato ISO
            trechos: trechos
        };

        try {
            const response = await fetch('/api/caronas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(caronaData)
            });

            if (response.ok) {
                const result = await response.json();
                alert(`Carona registrada!\nID: ${result.id}\nRota Salva no Backend.`);
                document.getElementById('clearBtn').click();
            }
        } catch (error) {
            console.error("Erro:", error);
            alert("Falha ao salvar a carona.");
        }
    };
</script>
</body>
</html>
