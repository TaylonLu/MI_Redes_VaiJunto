x-hosts: &hosts
  HOST_UNOVA: "172.16.230.27"
  HOST_KALOS: "172.16.230.17"
  HOST_JOHTO: "172.16.230.17"
  HOST_KANTO: "192.168.1.13"

services:
  unova:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vai-junto-unova
    ports:
      - "2602:2602"
    environment:
      <<: *hosts
      MAVEN_OPTS: "-Dserver.regiao=Unova -Dserver.port=2602"
    volumes:
      - .:/app
      - ./data:/app/data
      - maven-cache:/root/.m2

  kalos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vai-junto-kalos
    ports:
      - "2603:2603"
    environment:
      <<: *hosts
      MAVEN_OPTS: "-Dserver.regiao=Kalos -Dserver.port=2603"
    volumes:
      - .:/app
      - ./data:/app/data
      - maven-cache:/root/.m2

  johto:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vai-junto-johto
    ports:
      - "2604:2604"
    environment:
      <<: *hosts
      MAVEN_OPTS: "-Dserver.regiao=Johto -Dserver.port=2604"
    volumes:
      - .:/app
      - ./data:/app/data
      - maven-cache:/root/.m2

  kanto:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vai-junto-kanto
    ports:
      - "2605:2605"
    environment:
      <<: *hosts
      MAVEN_OPTS: "-Dserver.regiao=Kanto -Dserver.port=2605"
    volumes:
      - .:/app
      - ./data:/app/data
      - maven-cache:/root/.m2

volumes:
  maven-cache: